name: Update profile art

# Refreshes the animated SVG cards (hero, heatmap, activity, tiles, repos) daily from live GitHub data.
# Runs daily at ~06:17 UTC, on push to main, and on-demand via workflow_dispatch.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape live contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: Ben-coderr

      - name: Ensure ASCII portrait SVG is generated
        run: |
          if [ ! -f "abdenour-ascii.svg" ]; then
            python scripts/prep_photo.py source-photo.png source-prepped.png
            python scripts/make_ascii_svg.py source-prepped.png abdenour-ascii.svg
          fi

      - name: Render README cards (hero, tiles, activity, repos, heatmap)
        run: python scripts/render_readme_cards.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg abdenour-ascii.svg source-prepped.png"
