name: Update profile art

# Refreshes the contribution heatmap + info card daily from live GitHub data.
# Runs daily, on push to main, and on-demand via workflow_dispatch.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape live contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: Ben-coderr

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render stats SVG
        run: python scripts/render_stats_svg.py

      - name: Render info card SVG
        run: python scripts/make_info_card.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph & profile stats [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg info-card.svg"
